[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; This CP210x connection has dropped during 460800-baud writes. A conservative
; upload rate is slower but avoids leaving a partially written application.
upload_speed = 115200
lib_deps =
    gin66/FastAccelStepper @ 0.31.8
